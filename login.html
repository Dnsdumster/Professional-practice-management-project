<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Altrium PerformanceFlow</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="login-page">
    <section class="brand-section">
        <div><span class="brand-label">ALTRIUM</span><h1>PerformanceFlow</h1><p>A structured workspace for employee performance management.</p></div>
    </section>
    <section class="login-section">
        <div class="login-card">
            <h2>Welcome back</h2><p>Sign in to continue.</p>
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}{% for category, message in messages %}<div class="login-alert">{{ message }}</div>{% endfor %}{% endif %}
            {% endwith %}
            <form method="POST" id="loginForm">
                <label for="email">Email</label><input type="email" id="email" name="email" placeholder="name@altrium.com">
                <label for="password">Password</label><input type="password" id="password" name="password" placeholder="Enter password">
                <button type="submit" id="loginButton">Sign In</button>
            </form>
        </div>
    </section>
</div>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
